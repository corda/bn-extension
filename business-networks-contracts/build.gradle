description 'Corda Business Networks Contracts'

cordapp {
    targetPlatformVersion cordaPlatformVersion.toInteger()
    minimumPlatformVersion cordaPlatformVersion.toInteger()
    contract {
        name "Business Networks Showcase"
        vendor "Corda Open Source"
        versionId 1
        licence "Open Source (Apache 2)"
    }
}

configurations {
    // Hibernate 7, for the compile-only file dependency below.
    hibernate7Annotations {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // Both persistence APIs are compile-only and neither is bundled nor listed in the published POM: the node provides
    // the one its Hibernate version implements (javax.persistence on Corda 4.14 and earlier, jakarta.persistence on
    // Corda 4.15). The schema entities carry both sets of annotations, see net.corda.bn.schemas.
    compileOnly "javax.persistence:javax.persistence-api:$javaxPersistenceVersion"
    compileOnly "jakarta.persistence:jakarta.persistence-api:$jakartaPersistenceVersion"
    // The schema entities also carry a Hibernate 5 and a Hibernate 7 mapping of their VARCHAR columns (see net.corda.bn.schemas).
    // Both Hibernate jars are compile-only, neither is published or bundled: the node provides the one it runs. Hibernate 7 is a
    // file dependency, because Gradle does not resolve both hibernate-core modules into one configuration (they declare the same
    // capability).
    compileOnly "org.hibernate:hibernate-core:$hibernate5Version"
    hibernate7Annotations "org.hibernate.orm:hibernate-core:$hibernate7Version"
    compileOnly files(configurations.hibernate7Annotations)
    // SchemaMappingTest builds that mapping with the Hibernate of the Corda version the tests run on (Hibernate 7 from Corda 4.15),
    // which the Corda dependencies only put on the test runtime classpath.
    def cordaRunsHibernate7 = (cordaVersion.tokenize('.')[1].find(/^\d+/) as int) >= 15
    testCompileOnly(cordaRunsHibernate7 ? "org.hibernate.orm:hibernate-core:$hibernate7Version" : "org.hibernate:hibernate-core:$hibernate5Version")
    cordaProvided "$cordaReleaseGroup:corda-core:$cordaVersion"
    testImplementation"$cordaReleaseGroup:corda-core-test-utils:$cordaVersion"
    testImplementation "$cordaReleaseGroup:corda-test-utils:$cordaVersion"
    testImplementation"$cordaReleaseGroup:corda-node-driver:$cordaVersion"
    // SchemaMappingTest applies the node's AbstractParty converter, as the node does.
    testImplementation "$cordaReleaseGroup:corda-node:$cordaVersion"
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlinVersion"
    testImplementation "org.mockito.kotlin:mockito-kotlin:$mockitoKotlinVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "junit:junit:$junitVersion"
}

jar {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

test {
    jvmArgs = rootProject.ext.testJvmArgs
}