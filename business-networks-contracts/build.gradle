description 'Corda Business Networks Contracts'

cordapp {
    targetPlatformVersion cordaPlatformVersion.toInteger()
    minimumPlatformVersion cordaPlatformVersion.toInteger()
    contract {
        name "Business Networks Showcase"
        vendor "Corda Open Source"
        versionId 1
        licence "Open Source (Apache 2)"
    }
}

dependencies {
    // Both persistence APIs are compile-only and neither is bundled nor listed in the published POM: the node provides
    // the one its Hibernate version implements (javax.persistence on Corda 4.14 and earlier, jakarta.persistence on
    // Corda 4.15). The schema entities carry both sets of annotations, see net.corda.bn.schemas.
    compileOnly "javax.persistence:javax.persistence-api:$javaxPersistenceVersion"
    compileOnly "jakarta.persistence:jakarta.persistence-api:$jakartaPersistenceVersion"
    cordaProvided "$cordaReleaseGroup:corda-core:$cordaVersion"
    testImplementation"$cordaReleaseGroup:corda-core-test-utils:$cordaVersion"
    testImplementation "$cordaReleaseGroup:corda-test-utils:$cordaVersion"
    testImplementation"$cordaReleaseGroup:corda-node-driver:$cordaVersion"
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlinVersion"
    testImplementation "org.mockito.kotlin:mockito-kotlin:$mockitoKotlinVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "junit:junit:$junitVersion"
}

jar {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

test {
    jvmArgs = rootProject.ext.testJvmArgs
}