import static org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
import static org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
import static org.gradle.api.JavaVersion.VERSION_17

apply plugin: 'net.corda.plugins.cordformation'

description 'Corda Business Networks Integration demo'

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"

    cordaBootstrapper ("$corda_release_group:corda-node-api:$corda_release_version") {
        exclude group: "ch.qos.logback", module: "logback-classic"
    }
    corda "$corda_release_group:corda:$corda_release_version"
    
    cordapp project(':business-networks-contracts')
    cordapp project(':business-networks-workflows')
    cordapp project(':business-networks-demo:business-networks-demo-contracts')
    cordapp project(':business-networks-demo:business-networks-demo-workflows')
}

jar {
    // Prevent the root project from building an unwanted dummy CorDapp.
    enabled = false
}

java {
    sourceCompatibility = VERSION_17
    targetCompatibility = VERSION_17
}

compileJava {
    options.compilerArgs << '-parameters'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    compilerOptions {
        languageVersion = KOTLIN_1_9
        apiVersion = KOTLIN_1_9
        jvmTarget = JVM_17
        javaParameters = true   // Useful for reflection.
    }
}

task deployNodes(type: net.corda.plugins.Cordform, dependsOn: ['jar']) {
    nodeDefaults {
        projectCordapp {
            deploy = false
        }
        runSchemaMigration = true

        cordapp project(':business-networks-contracts')
        cordapp project(':business-networks-workflows')
        cordapp project(':business-networks-demo:business-networks-demo-contracts')
        cordapp project(':business-networks-demo:business-networks-demo-workflows')
    }
    node {
        name "O=Notary Service,L=Zurich,C=CH"
        notary = [validating: true]
        p2pPort 10002
        rpcSettings {
            address "localhost:10003"
            adminAddress "localhost:10004"
        }
    }
    node {
        name "O=Bank A,L=London,C=GB"
        p2pPort 10005
        rpcSettings {
            address "localhost:10006"
            adminAddress "localhost:10007"
        }
        rpcUsers = [[user: "BNOUser", password: "test", permissions: ["ALL"]]]
    }
    node {
        name "O=Bank B,L=New York,C=US"
        p2pPort 10008
        rpcSettings {
            address "localhost:10009"
            adminAddress "localhost:10010"
        }
        rpcUsers = [[user: "Member1", password: "test", permissions: ["ALL"]]]
    }
    node {
        name "O=Bank C,L=New York,C=US"
        p2pPort 10011
        rpcSettings {
            address "localhost:10012"
            adminAddress "localhost:10013"
        }
        rpcUsers = [[user: "Member2", password: "test", permissions: ["ALL"]]]
    }
}