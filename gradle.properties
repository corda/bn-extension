artifactoryContextUrl=https://software.r3.com/artifactory
publicArtifactLocation=https://download.corda.net/maven

# Dependency versions
cordaGradlePluginsVersion=5.1.1
cordaPlatformVersion=140
cordaReleaseGroup=net.corda
cordaUpdatesVersion=2.0
# The Corda version to build and test against; -PcordaVersion=4.15-RC02 on the command line overrides it.
# A jar built against 4.12 runs on 4.12 and 4.15 nodes; a jar built against 4.15 runs on 4.15 only.
cordaVersion=4.12.1
# Both persistence APIs are compile-only and neither is bundled: the node provides the one its Hibernate version
# implements (javax.persistence on Corda 4.14 and earlier, jakarta.persistence on Corda 4.15).
javaxPersistenceVersion=2.2
jakartaPersistenceVersion=3.2.0
quasarVersion=0.9.0_r3
quasarClassifier=
junitVersion=4.12
mockitoVersion=5.5.0
mockitoKotlinVersion=5.2.1
kotlinVersion=1.9.20
log4j2Version=2.23.1
slf4jVersion=2.0.12
mavenResolverVersion=1.4.1
jacksonVersion=2.17.0

projectVersion=1.3-SNAPSHOT
internalPublishVersion=1.+